name: mony_manager
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
repository: https://github.com/ThanCoder/mony_manager.git
version: 0.1.0

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cfb_store: ^0.7.0
  than_pkg_linux: ^0.2.0
  than_pkg_android: ^0.6.1
  package_info_plus: ^10.2.1
  dart_core_extensions: ^0.7.0

  t_widgets:
    git: https://github.com/ThanCoder/t_widgets.git
  # t_server:
  #   git: https://github.com/ThanCoder/t_server.git
  dual_store:
    git: https://github.com/ThanCoder/dual_store.git
  t_client:
    git: https://github.com/ThanCoder/t_client
  url_launcher: ^6.3.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  # dart run change_app_package_name:main [com.new.package.name]
  # dart run change_app_package_name:main than.app.mony_manager
  flutter_launcher_icons: ^0.14.4
  # dart run flutter_launcher_icons

  # dev lib
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/logo/logo.png"

flutter:
  uses-material-design: true

  assets:
  - assets/
  - assets/logo/
